name: Build iOS App

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
      
    - name: Build iOS App
      run: |
        cd ios
        xcodebuild -project PadelBookingApp.xcodeproj -scheme PadelBookingApp -configuration Release -destination 'generic/platform=iOS' build CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO
      
    - name: Create IPA
      run: |
        cd ios
        xcodebuild -project PadelBookingApp.xcodeproj -scheme PadelBookingApp -configuration Release -destination 'generic/platform=iOS' -archivePath build/PadelBookingApp.xcarchive archive CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO
        
    - name: Export IPA
      run: |
        cd ios
        xcodebuild -exportArchive -archivePath build/PadelBookingApp.xcarchive -exportPath output -exportOptionsPlist ExportOptions.plist CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO
        
    - name: Upload IPA
      uses: actions/upload-artifact@v4
      with:
        name: PadelBookingApp.ipa
        path: ios/output/PadelBookingApp.ipa