name: Build iOS App

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
      
    - name: Install xcodegen
      run: |
        npm install -g xcodegen
        
    - name: Generate Xcode project
      run: |
        cd ios
        xcodegen generate
        
    - name: Build iOS App
      run: |
        cd ios
        xcodebuild -project PadelBookingApp.xcodeproj -scheme PadelBookingApp -configuration Release -destination 'generic/platform=iOS Simulator' build CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO
      
    - name: Create archive
      run: |
        cd ios
        xcodebuild -project PadelBookingApp.xcodeproj -scheme PadelBookingApp -configuration Release -destination 'generic/platform=iOS Simulator' -archivePath build/PadelBookingApp.xcarchive archive CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO
        
    - name: Upload IPA
      uses: actions/upload-artifact@v4
      with:
        name: PadelBookingApp.ipa
        path: ios/build/PadelBookingApp.xcarchive