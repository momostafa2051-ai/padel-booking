workflows:
  ios-workflow:
    name: iOS Build
    max_build_duration: 120
    instance_type: mac_mini_m2
    environment:
      ios-signing:
        enabled: false
      xcode: latest
    scripts:
      - name: Build iOS App
        script: |
          cd ios
          xcodebuild -project PadelBookingApp.xcodeproj -scheme PadelBookingApp -configuration Release -destination 'generic/platform=iOS Simulator' build CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO
    artifacts:
      - build/**/*.app