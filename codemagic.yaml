workflows:
  ios-build:
    name: iOS Build
    max_build_duration: 120
    instance_type: mac_mini_m2
    environment:
      vars:
        XCODE_VERSION: "latest"
    scripts:
      - name: Set up code signing
        script: |
          keychain initialize
      - name: Build iOS project
        script: |
          cd $CM_BUILD_DIR/ios
          xcodebuild -project PadelBookingApp.xcodeproj -scheme PadelBookingApp -configuration Release -destination 'generic/platform=iOS Simulator' build CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO
    artifacts:
      - build/Release-iphonesimulator/*.app